<section class="booking-section" id="booking-form-container">
    <h2><i class="fas fa-edit"></i> Регистрация на квиз</h2>
    
    <form class="booking-form" id="quizBookingForm" novalidate data-name="quizbookingform">
        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="solo" name="flags" value="solo" data-single-checkbox>
                Я один (без команды), готов присоединиться к команде
            </label>
        </div>

        <div class="form-group">
            <label for="name">Имя <span>*</span></label>
            <input type="text" id="name" name="name" placeholder="Ваше имя" required>
            <span class="form-error-message" id="quizbookingform-name-error"><i class="fas fa-exclamation-circle"></i> <span>Текст ошибки</span></span>
        </div>

        <div class="form-group">
            <label for="teamName">Название команды</label>
            <input type="text" id="teamName" name="teamName" placeholder="Например: Киноманы" data-team-name>
            <span class="form-error-message" id="quizbookingform-teamName-error"><i class="fas fa-exclamation-circle"></i> <span>Текст ошибки</span></span>
        </div>

        <div class="form-group">
            <label for="contact">Контакт для связи (Телефон или Telegram) <span>*</span></label>
            <input type="text" id="contact" name="contact" placeholder="+7 (999) 000-00-00" required>
            <span class="form-error-message" id="quizbookingform-contact-error"><i class="fas fa-exclamation-circle"></i> <span>Текст ошибки</span></span>
        </div>

        <div class="form-group">
            <label for="quantity">Количество участников <span>*</span></label>
            <select id="quantity" name="quantity" required>
                <option value="" disabled selected>Выберите количество участников</option>
                <option value="1">1 человек</option>
                <option value="2">2 человека</option>
                <option value="3">3 человека</option>
                <option value="4">4 человека</option>
                <option value="5">5 человек</option>
                <option value="6">6 человек</option>
                <option value="7">7 человек</option>
                <option value="8">8 человек</option>
                <option value="9">9 человек</option>
                <option value="10">10 человек</option>
            </select>
            <span class="form-error-message" id="quizbookingform-quantity-error"><i class="fas fa-exclamation-circle"></i> <span>Текст ошибки</span></span>
        </div>

        <div class="form-group">
            <label for="occasion">ДР или другой праздничный повод</label>
            <input type="text" id="occasion" name="occasion" placeholder="Например: День рождения Васи">
            <span class="form-error-message" id="quizbookingform-occasion-error"><i class="fas fa-exclamation-circle"></i> <span>Текст ошибки</span></span>
        </div>

        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="joinTeam" name="flags" value="join_team">
                Готовы принимать новых участников в команду
            </label>
        </div>

        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="isAgree" name="flags" value="is_agree">
                Согласен с условиями <a href="policy.html">политики конфиденциальности</a>
            </label>
        </div>
        
        <button type="submit" class="btn-signup" id="submitBtn">
            <i class="fas fa-paper-plane"></i> Отправить заявку
        </button>
    </form>
</section>
